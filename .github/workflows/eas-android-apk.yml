name: EAS Android APK

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  API_URL: ${{ secrets.API_URL }}
  API_URL_CODE: ${{ secrets.API_URL_CODE }}
  API_TIMEOUT: ${{ secrets.API_TIMEOUT }}
  ADMIN_DASHBOARD_URL: ${{ secrets.ADMIN_DASHBOARD_URL }}
  APP_NAME: ${{ secrets.APP_NAME }}
  APP_VERSION: ${{ secrets.APP_VERSION }}
  AUTO_REFRESH_INTERVAL: ${{ secrets.AUTO_REFRESH_INTERVAL }}
  DEFAULT_PAGE_SIZE: ${{ secrets.DEFAULT_PAGE_SIZE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.EXPO_TOKEN }}" ] && missing="$missing EXPO_TOKEN"
          [ -z "${{ secrets.API_URL }}" ] && missing="$missing API_URL"
          [ -z "${{ secrets.API_URL_CODE }}" ] && missing="$missing API_URL_CODE"
          [ -z "${{ secrets.API_TIMEOUT }}" ] && missing="$missing API_TIMEOUT"
          [ -z "${{ secrets.ADMIN_DASHBOARD_URL }}" ] && missing="$missing ADMIN_DASHBOARD_URL"
          [ -z "${{ secrets.APP_NAME }}" ] && missing="$missing APP_NAME"
          [ -z "${{ secrets.APP_VERSION }}" ] && missing="$missing APP_VERSION"
          [ -z "${{ secrets.AUTO_REFRESH_INTERVAL }}" ] && missing="$missing AUTO_REFRESH_INTERVAL"
          [ -z "${{ secrets.DEFAULT_PAGE_SIZE }}" ] && missing="$missing DEFAULT_PAGE_SIZE"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # - name: Sync secrets to EAS
      #   run: |
      #     eas env:create --scope project --name API_URL --value "${{ secrets.API_URL }}" --visibility plaintext --environment production --non-interactive --force || true
      #     eas env:create --scope project --name API_URL_CODE --value "${{ secrets.API_URL_CODE }}" --visibility sensitive --environment production --non-interactive --force || true
      #     eas env:create --scope project --name API_TIMEOUT --value "${{ secrets.API_TIMEOUT }}" --visibility plaintext --environment production --non-interactive --force || true
      #     eas env:create --scope project --name ADMIN_DASHBOARD_URL --value "${{ secrets.ADMIN_DASHBOARD_URL }}" --visibility plaintext --environment production --non-interactive --force || true
      #     eas env:create --scope project --name APP_NAME --value "${{ secrets.APP_NAME }}" --visibility plaintext --environment production --non-interactive --force || true
      #     eas env:create --scope project --name APP_VERSION --value "${{ secrets.APP_VERSION }}" --visibility plaintext --environment production --non-interactive --force || true
      #     eas env:create --scope project --name AUTO_REFRESH_INTERVAL --value "${{ secrets.AUTO_REFRESH_INTERVAL }}" --visibility plaintext --environment production --non-interactive --force || true
      #     eas env:create --scope project --name DEFAULT_PAGE_SIZE --value "${{ secrets.DEFAULT_PAGE_SIZE }}" --visibility plaintext --environment production --non-interactive --force || true

