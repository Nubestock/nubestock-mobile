# SonarCloud / SonarQube — análisis de calidad en CI
# Crear proyecto en https://sonarcloud.io/projects/create (ej: Nubestock_nubestock-mobile)

sonar.projectKey=Nubestock_nubestock-mobile
sonar.organization=nubestock

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/__tests__/**,**/*.d.ts,**/types/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.test.exclusions=**/__tests__/**

sonar.coverage.exclusions=**/types/**,**/*.d.ts
